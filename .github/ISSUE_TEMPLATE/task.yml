name: 作業(タスク)
description: 機能の追加、不具合の修正、文書の更新など、すべての作業は、このイシューから始める
body:
  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: なぜ、この作業が必要か。
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: やること
      description: 作業の内容を、チェックリストで書く。
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完了条件
      description: 何ができたら、完了とするか。
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: ブランチ名(予定)
      description: 「種類/イシュー番号-説明」の形式。イシュー番号は、作成後に確定する。
      placeholder: feature/12-task-api
